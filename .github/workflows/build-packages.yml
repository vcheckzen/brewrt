name: Build LiBwrt packages for IPQ60XX (pinned 2025-01-25)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: LiBwrt source commit. Default = the exact commit your firmware was built from (9fd688c).
        required: true
        default: 9fd688ca337da15c6615bde9704b07f56d16c276
      config_flavor:
        description: Original firmware config (WIFI or NOWIFI). See README on how to check.
        required: true
        default: wifi
        type: choice
        options:
          - wifi
          - nowifi
      packages:
        description: 'Space-separated packages to compile: bare names (openssl-util, luci-app-passwall) or source paths (package/libs/openssl, package/feeds/packages/aria2). Leave empty to build the FULL firmware.'
        required: false
        default: openssl-util
      extra_feeds:
        description: Optional extra src-git feed lines appended to feeds.conf (one per line).
        required: false
        default: ''
      nss_packages_sha:
        description: Optional commit for the LiBwrt/nss-packages feed (its Jan-2025 history was rewritten, see README). Leave empty to skip it.
        required: false
        default: ''

env:
  SOURCE_URL: https://github.com/LiBwrt/LibWrt.git

concurrency:
  group: build-libwrt-ipq60xx
  cancel-in-progress: false

jobs:
  build:
    name: Build packages/firmware for LiBwrt IPQ60XX
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CONFIG_FLAVOR: ${{ inputs.config_flavor }}
      CONFIG_FILE: ipq60xx-6.12-${{ inputs.config_flavor }}.config
      PACKAGES: ${{ inputs.packages }}
      EXTRA_FEEDS: ${{ inputs.extra_feeds }}
      NSS_PACKAGES_SHA: ${{ inputs.nss_packages_sha }}
    steps:
      # maximize-build-space recreates the workspace, so it MUST run before
      # checkout or it wipes the files checkout just wrote.
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 4096
          root-reserve-mb: 1024
          temp-reserve-mb: 100

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        timeout-minutes: 30
        run: bash scripts/install-deps.sh

      # Fingerprint of the files that affect the build/package tree. Included in
      # the toolchain cache key so edits to configs/feeds/scripts invalidate it
      # (otherwise a cache HIT restores a stale tree and masks your changes).
      - name: Compute cache fingerprint
        id: fp
        run: |
          set -e
          test -f "configs/$CONFIG_FILE" || { echo "ERROR: configs/$CONFIG_FILE missing"; ls -la; ls -la configs 2>/dev/null || true; exit 1; }
          test -f feeds/pinned-6.12.conf || { echo "ERROR: feeds/pinned-6.12.conf missing"; exit 1; }
          echo "CFG_HASH=$(sha256sum "configs/$CONFIG_FILE" feeds/pinned-6.12.conf scripts/install-deps.sh scripts/install-custom-pkgs.sh scripts/collect-artifacts.sh | cut -c1-64 | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      - name: Clone LiBwrt source pinned to firmware commit
        timeout-minutes: 20
        run: |
          set -e
          git init -q openwrt
          cd openwrt
          git remote add origin "$SOURCE_URL"
          if git fetch -q --depth 1 origin "$SOURCE_SHA"; then
            git checkout -q FETCH_HEAD
          else
            echo "shallow-by-sha failed, fetching default branch and checking out pinned sha"
            git fetch -q --shallow-since=2025-01-20 origin main-nss
            git checkout -q "$SOURCE_SHA"
          fi
          echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"
          git log -1 --format='pinned commit: %H%ndate: %cs%nmessage: %s'

      - name: Apply config and pinned feeds
        timeout-minutes: 10
        run: |
          set -e
          cp "configs/$CONFIG_FILE" "$OPENWRT_PATH/.config"
          cp feeds/pinned-6.12.conf "$OPENWRT_PATH/feeds.conf"
          if [ -n "$NSS_PACKAGES_SHA" ]; then
            echo "src-git nss_packages https://github.com/LiBwrt/nss-packages.git^$NSS_PACKAGES_SHA" >> "$OPENWRT_PATH/feeds.conf"
          fi
          if [ -n "$EXTRA_FEEDS" ]; then
            printf '%s\n' "$EXTRA_FEEDS" >> "$OPENWRT_PATH/feeds.conf"
          fi
          cd "$OPENWRT_PATH"
          make defconfig

      - name: Update and install feeds
        timeout-minutes: 30
        run: |
          set -e
          cd "$OPENWRT_PATH"
          timeout 1500 ./scripts/feeds update -a
          # Extra packages the original firmware workflow added (pinned to 2025-01-25)
          bash "$GITHUB_WORKSPACE/scripts/install-custom-pkgs.sh"
          ./scripts/feeds install -a

      # Cache restore replaces the whole openwrt/ tree (source+feeds+dl+toolchain),
      # so config reload and downloads run AFTER it, on top of the restored tree.
      - name: Cache toolchain
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: "false"
          mixkey: libwrt-${{ inputs.source_sha }}-${{ inputs.config_flavor }}-${{ env.CFG_HASH }}-aarch64_cortex-a53
          prefix: ${{ env.OPENWRT_PATH }}

      - name: Reload config and download sources
        timeout-minutes: 30
        run: |
          set -e
          cd "$OPENWRT_PATH"
          test -f "$GITHUB_WORKSPACE/configs/$CONFIG_FILE" || { echo "ERROR: config missing"; exit 1; }
          cp "$GITHUB_WORKSPACE/configs/$CONFIG_FILE" .config
          make defconfig
          # The LiBwrt kernel adds a Kconfig symbol NF_CONNTRACK_DSCPREMARK_EXT
          # (qca-nss-ecm patch). Upstream supplies its value through the
          # kmod-qca-nss-ecm KCONFIG line in the nss-packages feed, which is
          # NOT reproducible (feed history was rewritten). OpenWrt maps any
          # CONFIG_KERNEL_* line in .config into the kernel config
          # (Kernel/Configure/Default), so inject the value here after the
          # final defconfig. Without it, kernel syncconfig prompts interactively
          # and fails on headless CI.
          echo "CONFIG_KERNEL_NF_CONNTRACK_DSCPREMARK_EXT=y" >> .config
          timeout 1500 make download -j8 || timeout 1500 make download -j1 V=s
          find dl -size -1024c -delete 2>/dev/null || true

      - name: Compile
        id: compile
        timeout-minutes: 300
        run: |
          set -e
          if [ -z "$PACKAGES" ]; then
            echo "==> building full firmware"
            cd "$OPENWRT_PATH"
            make -j$(nproc) V=s || make -j1 V=s
          else
            bash "$GITHUB_WORKSPACE/scripts/build-packages.sh"
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        if: steps.compile.outputs.status == 'success'
        run: bash "$GITHUB_WORKSPACE/scripts/collect-artifacts.sh"

      - name: Upload packages
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.config_flavor }}
          path: artifacts-apk/**
          if-no-files-found: warn

      - name: Upload firmware
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.config_flavor }}
          path: artifacts-firmware/**
          if-no-files-found: warn